<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;background:#000}
  .frame{width:1080px;height:1920px;position:relative;overflow:hidden;font-family:Inter,sans-serif;background:#0d0f24}
  svg{position:absolute;inset:0}
  .hud{position:absolute;left:0;right:0;top:70px;height:190px;background:linear-gradient(#05060fdd,#05060f00);padding:0 56px;box-sizing:border-box;display:flex;justify-content:space-between}
  .tag{font-size:22px;font-weight:800;letter-spacing:3px;color:#c9cbe0}
  .tag .dot{color:#ff3b4a}
  .time{font-size:92px;font-weight:800;color:#fff;line-height:1;margin-top:6px;letter-spacing:-2px}
  .time small{font-size:30px;letter-spacing:1px;margin-left:8px}
  .loc{font-size:22px;font-weight:700;letter-spacing:4px;color:#9a9db8;margin-top:10px}
  .right{text-align:right}
  .val{font-size:92px;font-weight:800;line-height:1;margin-top:6px;color:#ffd21f;text-shadow:0 0 24px #ffd21f66;letter-spacing:-1px;display:flex;align-items:center;gap:20px;justify-content:flex-end}
  .val.red{color:#ff3b4a;text-shadow:0 0 30px #ff3b4a99}
  .bars{display:flex;gap:6px;align-items:center}.bars i{display:block;width:8px;background:currentColor;border-radius:2px}
  .sub{position:absolute;left:40px;right:40px;top:1440px;text-align:center;font-size:96px;font-weight:800;color:#fff;letter-spacing:-1px;text-shadow:0 6px 0 #0008,0 0 30px #000a}
  .sub b{color:#ffd21f}
</style></head><body>
<div class="frame" id="f"></div>
<script>
const scene = new URLSearchParams(location.search).get('s') || 'tunnel';
const f = document.getElementById('f');
const W=1080,H=1920, VX=540, VY=980;
let s = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"><defs>
<radialGradient id="glow"><stop offset="0" stop-color="#ffb347" stop-opacity=".85"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
<radialGradient id="end"><stop offset="0" stop-color="#3a2a5a"/><stop offset="1" stop-color="#0d0f24"/></radialGradient>
<radialGradient id="mon"><stop offset="0" stop-color="#2a3a3a"/><stop offset="1" stop-color="#0c1414"/></radialGradient>
<filter id="noise"><feTurbulence baseFrequency=".9" numOctaves="2" seed="3"/><feColorMatrix values="0 0 0 0 .6  0 0 0 0 .8  0 0 0 0 .7  0 0 0 .18 0"/></filter>
</defs>`;

function tunnel(){
  let o='';
  // walls & ceiling as nested arches converging
  for(let i=14;i>=0;i--){
    const t=i/14, sc=Math.pow(t,1.6)*1.0+0.04;
    const w=1500*sc, h=1500*sc, cy=VY+ 520*sc;
    const shade = Math.round(18+ 30*t);
    o+=`<path d="M ${VX-w/2} ${cy} L ${VX-w/2} ${cy-h*0.55} Q ${VX-w/2} ${cy-h} ${VX} ${cy-h} Q ${VX+w/2} ${cy-h} ${VX+w/2} ${cy-h*0.55} L ${VX+w/2} ${cy} Z" fill="rgb(${shade},${shade+4},${shade+38})" stroke="#0a0b1c" stroke-width="${3*sc+1}"/>`;
  }
  // tunnel end glow
  o+=`<ellipse cx="${VX}" cy="${VY}" rx="70" ry="80" fill="url(#end)"/>`;
  // road
  o+=`<path d="M ${VX-30} ${VY+40} L ${VX+30} ${VY+40} L ${W+300} ${H} L -300 ${H} Z" fill="#1c1d33"/>`;
  o+=`<path d="M ${VX-30} ${VY+40} L ${VX-36} ${VY+40} L -330 ${H} L -300 ${H} Z" fill="#e8e6d8" opacity=".5"/>`;
  o+=`<path d="M ${VX+30} ${VY+40} L ${VX+36} ${VY+40} L ${W+330} ${H} L ${W+300} ${H} Z" fill="#e8e6d8" opacity=".5"/>`;
  for(let i=0;i<9;i++){const a=Math.pow(i/9,2),b=Math.pow((i+.5)/9,2);
    const y1=VY+40+a*(H-VY-40), y2=VY+40+b*(H-VY-40);
    o+=`<path d="M ${VX-2-a*10} ${y1} L ${VX+2+a*10} ${y1} L ${VX+2+b*10} ${y2} L ${VX-2-b*10} ${y2} Z" fill="#ffd21f" opacity=".85"/>`;}
  // ceiling lamps
  for(let i=1;i<14;i++){
    const t=i/14, sc=Math.pow(t,1.6)+0.04, cy=VY+520*sc-1500*sc*0.93;
    const lw=60*sc+4;
    o+=`<circle cx="${VX}" cy="${cy}" r="${140*sc+10}" fill="url(#glow)" opacity=".55"/>`;
    o+=`<rect x="${VX-lw/2}" y="${cy-6*sc-2}" width="${lw}" height="${12*sc+3}" rx="3" fill="#ffc96b"/>`;
  }
  // warning beacons
  [[ -1,0.55],[1,0.55],[-1,0.3],[1,0.3]].forEach(([side,t])=>{
    const sc=Math.pow(t,1.6)+0.04; const x=VX+side*560*sc, y=VY+40+ (H-VY-40)*Math.pow(t,1.1)*.85;
    const bw=46*sc*2.2, bh=150*sc*2.2;
    o+=`<path d="M ${x-bw/2} ${y} L ${x-bw/4} ${y-bh} L ${x+bw/4} ${y-bh} L ${x+bw/2} ${y} Z" fill="#ff5a2a"/>
        <rect x="${x-bw*0.38}" y="${y-bh*0.62}" width="${bw*0.76}" height="${bh*0.16}" fill="#f2f0e6"/>
        <circle cx="${x}" cy="${y-bh-8*sc}" r="${10*sc+2}" fill="#ffd21f"/>`;
  });
  // distant figure
  o+=`<g transform="translate(${VX+6} ${VY+30})"><rect x="-9" y="-60" width="18" height="50" rx="6" fill="#05050c"/><circle cx="0" cy="-70" r="12" fill="#05050c"/><circle cx="-4" cy="-71" r="1.8" fill="#fff"/><circle cx="4" cy="-71" r="1.8" fill="#fff"/><rect x="-7" y="-14" width="5" height="16" fill="#05050c"/><rect x="2" y="-14" width="5" height="16" fill="#05050c"/></g>`;
  // Jonas (foreground, orange vest)
  o+=jonas(250,1880,1.25);
  return o;
}
function jonas(x,y,k){
  return `<g transform="translate(${x} ${y}) scale(${k})">
   <rect x="-26" y="-250" width="20" height="250" rx="6" fill="#111"/><rect x="6" y="-250" width="20" height="250" rx="6" fill="#111"/>
   <path d="M -60 -260 Q -66 -470 0 -480 Q 66 -470 60 -260 Z" fill="#ff7a1f" stroke="#fff3" stroke-width="2"/>
   <rect x="-60" y="-350" width="120" height="16" fill="#f4f1e4"/><rect x="-60" y="-300" width="120" height="16" fill="#f4f1e4"/>
   <path d="M -60 -440 Q -100 -380 -86 -300" stroke="#ff7a1f" stroke-width="26" fill="none" stroke-linecap="round"/>
   <path d="M 60 -440 Q 104 -400 130 -420" stroke="#ff7a1f" stroke-width="26" fill="none" stroke-linecap="round"/>
   <rect x="120" y="-436" width="34" height="22" rx="5" fill="#333"/><circle cx="154" cy="-425" r="8" fill="#fff6c8"/>
   <path d="M 156 -425 L 760 -560 L 760 -300 Z" fill="#fff6c8" opacity=".12"/>
   <circle cx="0" cy="-560" r="88" fill="#0a0a0a"/>
   <path d="M -88 -585 Q -80 -660 0 -665 Q 80 -660 88 -585 Z" fill="#ffd21f"/><rect x="-96" y="-592" width="192" height="16" rx="8" fill="#e6b800"/>
   <circle cx="-26" cy="-545" r="26" fill="#fff"/><circle cx="30" cy="-545" r="26" fill="#fff"/>
   <circle cx="-20" cy="-548" r="11" fill="#000"/><circle cx="36" cy="-548" r="11" fill="#000"/>
   <ellipse cx="4" cy="-500" rx="12" ry="7" fill="#fff"/>
  </g>`;
}
function monitor(){
  let o=`<rect width="${W}" height="${H}" fill="#111326"/>`;
  // desk
  o+=`<rect x="0" y="1380" width="${W}" height="540" fill="#2a2140"/><rect x="0" y="1380" width="${W}" height="18" fill="#3b3058"/>`;
  // monitor
  o+=`<rect x="90" y="520" width="900" height="760" rx="26" fill="#1d1f2e" stroke="#2f3247" stroke-width="6"/>
      <rect x="130" y="560" width="820" height="680" rx="8" fill="url(#mon)"/>`;
  // camera view: tunnel in greenish
  for(let i=8;i>=0;i--){const t=i/8, sc=.15+t*.85; const w=820*sc, h=640*sc, cx=540, cy=900+260*sc;
    o+=`<path d="M ${cx-w/2} ${cy} L ${cx-w/2} ${cy-h*.5} Q ${cx-w/2} ${cy-h} ${cx} ${cy-h} Q ${cx+w/2} ${cy-h} ${cx+w/2} ${cy-h*.5} L ${cx+w/2} ${cy} Z" fill="rgb(${30+18*t},${48+24*t},${44+20*t})" opacity=".9"/>`;}
  o+=`<clipPath id="c"><rect x="130" y="560" width="820" height="680" rx="8"/></clipPath>
      <g clip-path="url(#c)"><path d="M 520 1000 L 560 1000 L 980 1260 L 100 1260 Z" fill="#203230"/>
      <g transform="translate(540 1040)"><rect x="-26" y="-170" width="52" height="140" rx="16" fill="#020404"/><circle cx="0" cy="-200" r="34" fill="#020404"/>
      <circle cx="-11" cy="-203" r="5" fill="#e8fff4"/><circle cx="11" cy="-203" r="5" fill="#e8fff4"/>
      <rect x="-22" y="-40" width="16" height="44" fill="#020404"/><rect x="6" y="-40" width="16" height="44" fill="#020404"/></g>
      <rect x="130" y="560" width="820" height="680" filter="url(#noise)"/>
      ${Array.from({length:40},(_,i)=>`<rect x="130" y="${560+i*17}" width="820" height="3" fill="#000" opacity=".18"/>`).join('')}</g>
      <text x="160" y="610" font-family="DejaVu Sans Mono" font-size="30" fill="#e8fff4">CAM 04 · RÖHRE OST</text>
      <circle cx="900" cy="600" r="11" fill="#ff3b4a"/><text x="840" y="611" font-family="DejaVu Sans Mono" font-size="30" fill="#ff3b4a">REC</text>
      <text x="160" y="1215" font-family="DejaVu Sans Mono" font-size="28" fill="#e8fff4" opacity=".8">15.11. 03:07:42</text>
      <rect x="500" y="1280" width="80" height="100" fill="#1d1f2e"/>`;
  // glow on scene
  o+=`<ellipse cx="540" cy="1100" rx="700" ry="600" fill="#3ad6a0" opacity=".05"/>`;
  return o;
}
s += scene==='tunnel' ? tunnel() : monitor();
s += `</svg>`;
const hud = scene==='tunnel'
 ? {time:'03:07',loc:'BRANDBERGTUNNEL',val:'400 M',red:false,sub:'NIEMAND DARF <b>HIER REIN</b>'}
 : {time:'03:07',loc:'KAMERA 4',val:'400 M',red:false,sub:'MITTEN AUF DER <b>FAHRBAHN</b>'};
const bars=[14,22,30,22,14].map(h=>`<i style="height:${h}px"></i>`).join('');
s += `<div class="hud"><div><div class="tag"><span class="dot">●</span> SCHICHT 3</div><div class="time">${hud.time}<small>UHR</small></div><div class="loc">${hud.loc}</div></div>
<div class="right"><div class="tag">ABSTAND</div><div class="val ${hud.red?'red':''}"><span class="bars">${bars}</span>${hud.val}</div></div></div>
<div class="sub">${hud.sub}</div>`;
f.innerHTML = s;
</script></body></html>
