<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;background:#000}
  .frame{width:1080px;height:1920px;position:relative;overflow:hidden;font-family:Inter,sans-serif;background:#0d0f24}
  #art{position:absolute;inset:0;transform-origin:50% 50%}
  svg{position:absolute;inset:0}
  .hud{position:absolute;left:0;right:0;top:70px;height:190px;padding:0 56px;box-sizing:border-box;display:flex;justify-content:space-between;z-index:5}
  .hudbg{position:absolute;left:0;right:0;top:0;height:330px;background:linear-gradient(#05060fee,#05060f00);z-index:4}
  .tag{font-size:22px;font-weight:800;letter-spacing:3px;color:#c9cbe0}
  .tag .dot{color:#ff3b4a}
  .time{font-size:92px;font-weight:800;color:#fff;line-height:1;margin-top:6px;letter-spacing:-2px}
  .time small{font-size:30px;letter-spacing:1px;margin-left:8px}
  .loc{font-size:22px;font-weight:700;letter-spacing:4px;color:#9a9db8;margin-top:10px}
  .right{text-align:right}
  .val{font-size:92px;font-weight:800;line-height:1;margin-top:6px;color:#ffd21f;text-shadow:0 0 24px #ffd21f66;letter-spacing:-1px;display:flex;align-items:center;gap:20px;justify-content:flex-end;transform-origin:100% 50%}
  .val.red{color:#ff3b4a;text-shadow:0 0 30px #ff3b4a99}
  .bars{display:flex;gap:6px;align-items:center}.bars i{display:block;width:8px;background:currentColor;border-radius:2px}
  .sub{position:absolute;left:40px;right:40px;top:1440px;text-align:center;font-size:100px;font-weight:800;color:#fff;letter-spacing:-1px;line-height:1.05;text-shadow:0 6px 0 #000a,0 0 30px #000c;-webkit-text-stroke:14px #05060c;paint-order:stroke fill;z-index:6}
  .sub b{color:#ffd21f}
  .sub.m{font-style:italic}.sub.m b{color:#7fd4ff}
  .flash{position:absolute;inset:0;z-index:7;pointer-events:none}
  .vign{position:absolute;inset:0;z-index:3;background:radial-gradient(ellipse at 50% 50%,transparent 55%,#000a 100%)}
</style></head><body>
<div class="frame"><div id="art"></div><div class="vign"></div><div class="hudbg" id="hudbg"></div><div id="hud"></div><div class="sub" id="sub"></div><div class="flash" id="flash"></div></div>
<script src="timing.js"></script>
<script src="timeline.js"></script>
<script>
const W=1080,H=1920,VX=540,VY=980;
const DEFS=`<defs>
<radialGradient id="glow"><stop offset="0" stop-color="#ffb347" stop-opacity=".85"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
<radialGradient id="end"><stop offset="0" stop-color="#3a2a5a"/><stop offset="1" stop-color="#0d0f24"/></radialGradient>
<radialGradient id="mon"><stop offset="0" stop-color="#2a3a3a"/><stop offset="1" stop-color="#0c1414"/></radialGradient>
<radialGradient id="redg"><stop offset="0" stop-color="#ff3b4a" stop-opacity=".55"/><stop offset="1" stop-color="#ff3b4a" stop-opacity="0"/></radialGradient>
<filter id="noise"><feTurbulence baseFrequency=".9" numOctaves="2" seed="SEED"/><feColorMatrix values="0 0 0 0 .6  0 0 0 0 .8  0 0 0 0 .7  0 0 0 .2 0"/></filter>
</defs>`;
const rnd=(n)=>{const x=Math.sin(n*12.9898)*43758.5453;return x-Math.floor(x)};

function figure(x,y,k,eyes='#fff'){ // dunkle Gestalt
  return `<g transform="translate(${x} ${y}) scale(${k})"><rect x="-9" y="-60" width="18" height="50" rx="6" fill="#020308"/><circle cx="0" cy="-70" r="12" fill="#020308"/><circle cx="-4" cy="-71" r="1.9" fill="${eyes}"/><circle cx="4" cy="-71" r="1.9" fill="${eyes}"/><rect x="-7" y="-14" width="5" height="16" fill="#020308"/><rect x="2" y="-14" width="5" height="16" fill="#020308"/></g>`;
}
function tunnelBase(t,flick=0,showFig=true,lampOn=null){
  let o='';
  for(let i=14;i>=0;i--){const tt=i/14, sc=Math.pow(tt,1.6)+0.04;const w=1500*sc,h=1500*sc,cy=VY+520*sc;const sh=Math.round(18+30*tt);
    o+=`<path d="M ${VX-w/2} ${cy} L ${VX-w/2} ${cy-h*0.55} Q ${VX-w/2} ${cy-h} ${VX} ${cy-h} Q ${VX+w/2} ${cy-h} ${VX+w/2} ${cy-h*0.55} L ${VX+w/2} ${cy} Z" fill="rgb(${sh},${sh+4},${sh+38})" stroke="#0a0b1c" stroke-width="${3*sc+1}"/>`;}
  o+=`<ellipse cx="${VX}" cy="${VY}" rx="70" ry="80" fill="url(#end)"/>`;
  o+=`<path d="M ${VX-30} ${VY+40} L ${VX+30} ${VY+40} L ${W+300} ${H} L -300 ${H} Z" fill="#1c1d33"/>`;
  o+=`<path d="M ${VX-30} ${VY+40} L ${VX-36} ${VY+40} L -330 ${H} L -300 ${H} Z" fill="#e8e6d8" opacity=".5"/><path d="M ${VX+30} ${VY+40} L ${VX+36} ${VY+40} L ${W+330} ${H} L ${W+300} ${H} Z" fill="#e8e6d8" opacity=".5"/>`;
  for(let i=0;i<9;i++){const a=Math.pow(i/9,2),b=Math.pow((i+.5)/9,2);const y1=VY+40+a*(H-VY-40),y2=VY+40+b*(H-VY-40);
    o+=`<path d="M ${VX-2-a*10} ${y1} L ${VX+2+a*10} ${y1} L ${VX+2+b*10} ${y2} L ${VX-2-b*10} ${y2} Z" fill="#ffd21f" opacity=".85"/>`;}
  for(let i=1;i<14;i++){const tt=i/14, sc=Math.pow(tt,1.6)+0.04, cy=VY+520*sc-1500*sc*0.93;const lw=60*sc+4;
    let on = flick && i===10 && Math.floor(t*9)%3===0 ? 0.15 : 1; if(lampOn) on*=lampOn(i);
    o+=`<circle cx="${VX}" cy="${cy}" r="${140*sc+10}" fill="url(#glow)" opacity="${.55*on}"/><rect x="${VX-lw/2}" y="${cy-6*sc-2}" width="${lw}" height="${12*sc+3}" rx="3" fill="#ffc96b" opacity="${on}"/>`;}
  [[-1,0.55],[1,0.55],[-1,0.3],[1,0.3]].forEach(([s,tt])=>{const sc=Math.pow(tt,1.6)+0.04;const x=VX+s*560*sc,y=VY+40+(H-VY-40)*Math.pow(tt,1.1)*.85;const bw=46*sc*2.2,bh=150*sc*2.2;
    o+=`<path d="M ${x-bw/2} ${y} L ${x-bw/4} ${y-bh} L ${x+bw/4} ${y-bh} L ${x+bw/2} ${y} Z" fill="#ff5a2a"/><rect x="${x-bw*0.38}" y="${y-bh*0.62}" width="${bw*0.76}" height="${bh*0.16}" fill="#f2f0e6"/><circle cx="${x}" cy="${y-bh-8*sc}" r="${10*sc+2}" fill="#ffd21f" opacity="${Math.floor(t*2)%2?1:.35}"/>`;});
  if(showFig) o+=figure(VX+6,VY+30,1);
  return o;
}
function monitorScreen(x,y,w,h,t,figScale,marker,label='CAM 04 · RÖHRE OST',inner=null){
  let o=`<rect x="${x-40}" y="${y-40}" width="${w+80}" height="${h+80}" rx="26" fill="#1d1f2e" stroke="#2f3247" stroke-width="6"/><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="url(#mon)"/>`;
  const id='c'+Math.round(x)+Math.round(y);
  o+=`<clipPath id="${id}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8"/></clipPath><g clip-path="url(#${id})">`;
  if(inner){o+=inner;}else{
    const cx=x+w/2;
    for(let i=8;i>=0;i--){const tt=i/8, sc=.15+tt*.85;const ww=w*sc,hh=h*.94*sc,cy=y+h*.5+h*.38*sc;
      o+=`<path d="M ${cx-ww/2} ${cy} L ${cx-ww/2} ${cy-hh*.5} Q ${cx-ww/2} ${cy-hh} ${cx} ${cy-hh} Q ${cx+ww/2} ${cy-hh} ${cx+ww/2} ${cy-hh*.5} L ${cx+ww/2} ${cy} Z" fill="rgb(${30+18*tt},${48+24*tt},${44+20*tt})"/>`;}
    o+=`<path d="M ${cx-20} ${y+h*.64} L ${cx+20} ${y+h*.64} L ${x+w+40} ${y+h} L ${x-40} ${y+h} Z" fill="#203230"/>`;
    const fy=y+h*.64+ (figScale-1)*h*.13;
    if(marker){o+=`<ellipse cx="${cx}" cy="${fy+6}" rx="${70*figScale/2.5}" ry="${16*figScale/2.5}" fill="none" stroke="#ff3b4a" stroke-width="4" stroke-dasharray="10 8"/>`;}
    if(figScale>0) o+=figure(cx,fy,figScale*1.4,'#e8fff4');
  }
  o+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" filter="url(#noise)"/>`;
  for(let i=0;i<h/17;i++) o+=`<rect x="${x}" y="${y+i*17}" width="${w}" height="3" fill="#000" opacity=".18"/>`;
  const roll=(t*120)%h; o+=`<rect x="${x}" y="${y+roll}" width="${w}" height="40" fill="#fff" opacity=".04"/>`;
  o+=`</g><text x="${x+30}" y="${y+50}" font-family="DejaVu Sans Mono" font-size="30" fill="#e8fff4">${label}</text>`;
  if(Math.floor(t*2)%2===0) o+=`<circle cx="${x+w-110}" cy="${y+40}" r="11" fill="#ff3b4a"/>`;
  o+=`<text x="${x+w-90}" y="${y+51}" font-family="DejaVu Sans Mono" font-size="30" fill="#ff3b4a">REC</text>`;
  return o;
}
function camScene(seg,lt,t){
  let o=`<rect width="${W}" height="${H}" fill="#111326"/><rect x="0" y="1380" width="${W}" height="540" fill="#2a2140"/><rect x="0" y="1380" width="${W}" height="18" fill="#3b3058"/>`;
  o+=`<rect x="500" y="1280" width="80" height="100" fill="#1d1f2e"/>`;
  o+=monitorScreen(130,560,820,680,t,seg.camScale,seg.marker);
  if(seg.marker) o+=`<g transform="translate(540 ${560+680*.64+(seg.camScale-1)*680*.13+70})"><rect x="-150" y="0" width="300" height="56" rx="28" fill="#ff3b4a"/><text x="0" y="38" text-anchor="middle" font-family="Inter" font-weight="800" font-size="28" fill="#fff">HIER STAND ICH</text></g>`;
  o+=`<ellipse cx="540" cy="1000" rx="700" ry="600" fill="#3ad6a0" opacity=".05"/>`;
  return o;
}
// ===== Figuren, Mimik & Gestik =====
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const ease=x=>{x=clamp(x);return x*x*(3-2*x)};
const lerp=(a,b,k)=>a+(b-a)*k;
const GLOVE='#e8e2cf', VEST='#ff7a1f', STRIPE='#f4f1e4';

// Wer spricht gerade, wie weit ist der Mund offen?
// Sobald die echte Stimme vorliegt, setzt window.MOUTH (Lautstärke pro Frame, 0..1) die Mundöffnung.
function speech(seg,t){
  const cs=seg.chunksT; const c=cs.find(c=>t>=c.start&&t<c.end-0.05);
  let open=0, who=null;
  if(c){ who=c.speaker;
    if(window.MOUTH){ open=clamp((window.MOUTH[Math.floor(t*30)]||0)*1.6); }
    else { const syl=Math.abs(Math.sin(t*Math.PI*2*4.3)); open=syl*(0.5+0.5*rnd(Math.floor(t*8.6)+3)); }
  }
  return {who,open,c};
}
// Posen pro Untertitel-Chunk, weich überblendet
function pose(seg,t,table,def){
  const cs=seg.chunksT; let cur={...def}, prev={...def}, since=99;
  for(let i=0;i<cs.length;i++){ if(t>=cs[i].start-0.1 && table[i]){ prev=cur; cur={...cur,...table[i]}; since=t-(cs[i].start-0.1); } }
  const k=ease(since/0.28), out={};
  for(const key in cur){ const a=prev[key], b=cur[key];
    if(typeof b==='number'&&typeof a==='number') out[key]=lerp(a,b,k);
    else if(Array.isArray(b)&&Array.isArray(a)) out[key]=b.map((v,i)=>lerp(a[i],v,k));
    else out[key]=b; }
  return out;
}
function blinkAt(t,seed=0){const ph=(t+seed)%3.3;return ph<0.15?Math.sin(ph/0.15*Math.PI):0;}

// Gesicht (Ursprung = Kopfmitte, Radius 88)
function face(o){
  const p={lx:0,ly:0,open:0,blink:0,lid:0,scared:0,sweat:0,t:0,talking:false,...o};
  const r=26+5*p.scared, pr=11-4*p.scared;
  let s=`<circle r="88" fill="#0a0a0a"/>
   <path d="M -88 -25 Q -80 -100 0 -105 Q 80 -100 88 -25 Z" fill="#ffd21f"/><rect x="-96" y="-32" width="192" height="16" rx="8" fill="#e6b800"/>`;
  [[-28,-1],[30,1]].forEach(([cx,sg])=>{const cy=15;
    s+=`<ellipse cx="${cx}" cy="${cy}" rx="${r}" ry="${Math.max(2,r*(1-p.blink*0.95))}" fill="#fff"/>`;
    if(p.blink<0.6) s+=`<circle cx="${cx+6*sg*0+p.lx}" cy="${cy-3+p.ly}" r="${pr}" fill="#000"/>`;
    if(Math.abs(p.lid)>0.02&&p.blink<0.6){ // Augenlid: >0 besorgt (innen hoch), <0 misstrauisch (innen tief)
      const inner=cx+(-sg)*(r+4), outer=cx+sg*(r+4);
      const yIn=cy-r+(p.lid<0?-p.lid*r*1.0:0), yOut=cy-r+(p.lid>0?p.lid*r*1.0:0);
      s+=`<path d="M ${inner} ${cy-r-8} L ${outer} ${cy-r-8} L ${outer} ${yOut} L ${inner} ${yIn} Z" fill="#0a0a0a"/>`;}
  });
  if(p.open>0.05){const ry=4+20*p.open, rx=14+5*p.open;
    s+=`<ellipse cx="4" cy="62" rx="${rx}" ry="${ry}" fill="#fff"/>`;
    if(p.open>0.25) s+=`<ellipse cx="4" cy="${62+ry*0.15}" rx="${rx*0.68}" ry="${ry*0.62}" fill="#6b1424"/>`;
  } else if(p.scared>0.5) s+=`<ellipse cx="4" cy="62" rx="9" ry="12" fill="#fff"/><ellipse cx="4" cy="63" rx="5" ry="7" fill="#6b1424"/>`;
  else s+=`<rect x="-11" y="58" width="30" height="6" rx="3" fill="#fff"/>`;
  if(p.sweat>0.05){const y=-20+((p.t*45)%70);
    s+=`<path d="M 78 ${y} q -10 16 0 22 q 10 -6 0 -22 Z" fill="#9fd8ff" opacity="${p.sweat}"/>`;}
  return s;
}
function arm(sx,sy,a1,a2,len=115,col=VEST,w=26){
  const d=Math.PI/180, ex=sx+Math.cos(a1*d)*len, ey=sy+Math.sin(a1*d)*len, hx=ex+Math.cos(a2*d)*len, hy=ey+Math.sin(a2*d)*len;
  return {svg:`<path d="M ${sx} ${sy} L ${ex} ${ey} L ${hx} ${hy}" stroke="${col}" stroke-width="${w}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`,hx,hy};
}
// Ganzkörper (Ursprung = zwischen den Füßen)
function jonasBody(o,t){
  const p={armL:[105,95],armR:[60,-10],flash:true,finger:false,step:0,tremble:0,shake:0,tilt:0,face:{},...o};
  const tr=p.tremble?(rnd(t*40)-.5)*7*p.tremble:0;
  let s=`<g transform="translate(${tr} 0)">
   <rect x="-26" y="-250" width="20" height="250" rx="6" fill="#111" transform="rotate(${p.step} -16 -250)"/><rect x="6" y="-250" width="20" height="250" rx="6" fill="#111" transform="rotate(${-p.step} 16 -250)"/>
   <path d="M -60 -260 Q -66 -470 0 -480 Q 66 -470 60 -260 Z" fill="${VEST}"/>
   <rect x="-60" y="-350" width="120" height="16" fill="${STRIPE}"/><rect x="-60" y="-300" width="120" height="16" fill="${STRIPE}"/>`;
  const L=arm(-55,-440,p.armL[0],p.armL[1]), R=arm(55,-440,p.armR[0],p.armR[1]);
  if(p.flash){const a=p.armR[1]*Math.PI/180, bx=R.hx+Math.cos(a)*40, by=R.hy+Math.sin(a)*40;
    s+=`<path d="M ${bx} ${by} L ${bx+Math.cos(a+.22)*800} ${by+Math.sin(a+.22)*800} L ${bx+Math.cos(a-.22)*800} ${by+Math.sin(a-.22)*800} Z" fill="#fff6c8" opacity=".13"/>`;}
  s+=L.svg+`<circle cx="${L.hx}" cy="${L.hy}" r="16" fill="${GLOVE}"/>`;
  if(p.finger) s+=`<rect x="${L.hx-6}" y="${L.hy-50}" width="12" height="42" rx="6" fill="${GLOVE}"/>`;
  s+=R.svg;
  if(p.flash) s+=`<g transform="translate(${R.hx} ${R.hy}) rotate(${p.armR[1]})"><rect x="0" y="-11" width="42" height="22" rx="5" fill="#333"/><circle cx="42" cy="0" r="9" fill="#fff6c8"/></g>`;
  s+=`<circle cx="${R.hx}" cy="${R.hy}" r="16" fill="${GLOVE}"/>`;
  const hx=Math.sin(t*13)*12*p.shake;
  s+=`<g transform="translate(${hx} -560) rotate(${p.tilt})">${face({...p.face,t})}</g></g>`;
  return s;
}
// Oberkörper mit Funkgerät (radioK: 0 = am Mund, 1 = am Ohr)
function jonasUpper(o,t){
  const p={radioK:0,tremble:0,ledOn:false,red:false,face:{},...o};
  const tr=p.tremble?(rnd(t*40)-.5)*6*p.tremble:0;
  const hx=lerp(92,128,p.radioK), hy=lerp(-455,-610,p.radioK), rot=lerp(-12,8,p.radioK);
  return `<g transform="translate(${tr} 0)"><path d="M -150 0 Q -160 -420 0 -440 Q 160 -420 150 0 Z" fill="${VEST}"/>
    <rect x="-150" y="-300" width="300" height="26" fill="${STRIPE}"/><rect x="-150" y="-220" width="300" height="26" fill="${STRIPE}"/>
    <g transform="translate(0 -560) scale(1.1)">${face({...p.face,t})}</g>
    <path d="M 120 -380 Q 250 -340 ${hx+20} ${hy+60}" stroke="${VEST}" stroke-width="56" fill="none" stroke-linecap="round"/>
    <g transform="translate(${hx} ${hy}) rotate(${rot})"><rect x="-32" y="-80" width="64" height="140" rx="14" fill="#222"/><rect x="8" y="-150" width="10" height="75" fill="#222"/>
      <rect x="-22" y="-62" width="44" height="28" rx="4" fill="${p.red?'#ff3b4a':'#4be38c'}" opacity="${p.ledOn?.95:.35}"/>
      ${[0,1,2].map(i=>`<rect x="-20" y="${-20+i*14}" width="40" height="5" rx="2" fill="#444"/>`).join('')}</g>
    <circle cx="${hx+18}" cy="${hy+50}" r="30" fill="${GLOVE}"/></g>`;
}
// Jonas von hinten (vor dem Monitor)
function backHead(lean,t){
  return `<g transform="translate(0 ${-lean*24}) scale(${1+lean*0.06})"><path d="M -230 260 Q -220 -60 0 -80 Q 220 -60 230 260 Z" fill="${VEST}"/>
   <rect x="-226" y="40" width="452" height="26" fill="${STRIPE}"/><circle cx="0" cy="-170" r="110" fill="#0a0a0a"/>
   <path d="M -112 -170 Q -105 -300 0 -305 Q 105 -300 112 -170 Z" fill="#ffd21f"/><rect x="-118" y="-182" width="236" height="18" rx="9" fill="#e6b800"/></g>`;
}

const SCENES={
  monitorWall(seg,lt,t){
    let o=`<rect width="${W}" height="${H}" fill="#0f1122"/><rect x="0" y="1450" width="${W}" height="470" fill="#2a2140"/>`;
    const cams=[[60,520,'CAM 01'],[560,520,'CAM 02'],[60,950,'CAM 03'],[560,950,'CAM 04']];
    cams.forEach(([x,y,l],i)=>{
      if(i<3){o+=`<rect x="${x}" y="${y}" width="460" height="380" rx="14" fill="#1d1f2e"/><rect x="${x+20}" y="${y+20}" width="420" height="340" rx="6" fill="#16241f"/>
        <path d="M ${x+130} ${y+360} L ${x+210} ${y+170} L ${x+250} ${y+170} L ${x+330} ${y+360} Z" fill="#203230"/><text x="${x+36}" y="${y+56}" font-family="DejaVu Sans Mono" font-size="22" fill="#cfe">${l}</text>`;}
      else{const fl=rnd(Math.floor(t*14))>.7?.25:1;
        o+=`<g opacity="${fl}">`+monitorScreen(x+20,y+20,420,340,t,0.8,false,'CAM 04')+`</g>`;
        o+=`<rect x="${x+8}" y="${y+8}" width="444" height="364" rx="12" fill="none" stroke="#ff3b4a" stroke-width="6" opacity="${.5+.5*Math.sin(t*6)}"/>`;}
    });
    o+=`<ellipse cx="770" cy="1140" rx="420" ry="360" fill="url(#redg)" opacity=".5"/>`;
    // Jonas spricht zum Zuschauer, Warnfinger bei "Regel" / "Schau nicht", Blick zu Kamera 4
    const sp=speech(seg,t);
    const ps=pose(seg,t,{0:{lx:0,lid:0},2:{lx:-3,lid:0.25},3:{finger:1,armL:[160,268],lid:-0.25},4:{lx:10,ly:-2,lid:0.45},5:{lx:12,ly:-4,lid:0.5}},
      {finger:0,armL:[105,95],lx:0,ly:2,lid:0});
    o+=`<g transform="translate(260 1985) scale(1.35)">${jonasBody({flash:false,armR:[80,100],armL:ps.armL,finger:ps.finger>0.5,face:{lx:ps.lx,ly:ps.ly,lid:ps.lid,open:sp.who==='jonas'?sp.open:0,blink:blinkAt(t)}},t)}</g>`;
    return o;
  },
  tunnel(seg,lt,t){
    const sp=speech(seg,t);
    const ps=pose(seg,t,{0:{armL:[215,270],wave:1},1:{armL:[105,95],wave:0,lid:0},4:{lid:0.2},5:{lid:-0.35,shake:1},6:{shake:0.6}},
      {armL:[105,95],wave:0,lid:0,shake:0});
    const armL=[ps.armL[0],ps.armL[1]+Math.sin(t*12)*22*ps.wave];
    const sweep=Math.sin(t*1.3)*8;
    return tunnelBase(t)+`<g transform="translate(250 1880) scale(1.25)">${jonasBody({armL,armR:[60,-10+sweep],shake:ps.shake,face:{lx:2,ly:0,lid:ps.lid,open:sp.who==='jonas'?sp.open:0,blink:blinkAt(t,1)}},t)}</g>`;
  },
  cam(seg,lt,t){

    const cs=seg.chunksT, rev=cs[2].start;
    if(t<rev){ // Dunkelheit, nur vier Augen
      return `<rect width="${W}" height="${H}" fill="#020205"/>`+CL_DEFS+[[380,1000],[700,1020]].map(([x,y])=>`<circle cx="${x-36}" cy="${y}" r="16" fill="#fff" opacity=".9"/><circle cx="${x+36}" cy="${y}" r="16" fill="#fff" opacity=".9"/><circle cx="${x-36}" cy="${y}" r="50" fill="url(#eyeglow)" opacity=".4"/><circle cx="${x+36}" cy="${y}" r="50" fill="url(#eyeglow)" opacity=".4"/>`).join('');
    }
    let o=tunnelBase(t,0,false,()=>0)+`<rect width="${W}" height="${H}" fill="#03030a" opacity=".4"/>`;
    o+=`<path d="M 700 1900 L 0 600 L 1080 600 Z" fill="#fff6c8" opacity=".12"/>`;
    o+=`<g transform="translate(330 1650) scale(.9)">${clown({tilt:-14,glow:.4},t)}</g><g transform="translate(760 1690) scale(.95)">${clown({tilt:16,glow:.4,armUp:.6},t+1.3)}</g>`;
    o+=`<rect width="${W}" height="${H}" fill="#ff1e3c" opacity="${.12+.1*Math.sin(t*9)}"/>`;
    return o;
  },
});

const {segs,duration}=buildSchedule(SEGMENTS);
window.DURATION=duration;
const bars=[14,22,30,22,14];
function fmtSub(c){return c.replace(/\*(.+?)\*/g,'<b>$1</b>');}
window.renderAt=function(t){
  const seg=segs.find(s=>t>=s.start&&t<s.end)||segs[segs.length-1];
  const lt=t-seg.start, sd=seg.end-seg.start;
  // langsamer Kamera-Zoom pro Szene
  const z=1+0.06*(lt/sd);
  const shake = seg.red||['behind','two','clownReveal','run'].includes(seg.scene) ? `translate(${(rnd(t*30)-.5)*8}px,${(rnd(t*31)-.5)*8}px)` : '';
  document.getElementById('art').style.transform=`scale(${z}) ${shake}`;
  document.getElementById('art').innerHTML=`<svg viewBox="0 0 ${W} ${H}">${DEFS.replace('SEED',Math.floor(t*12)%50)}${SCENES[seg.scene](seg,lt,t)}</svg>`;
  // HUD
  const hudEl=document.getElementById('hud');document.getElementById('hudbg').style.display=seg.hud?'block':'none';
  if(seg.hud){const h=seg.hud;let val=h.val, pop=1; if(h.count){const k=ease(lt/sd);val=Math.round(lerp(h.count[0],h.count[1],k)/10)*10+' M';}
    if(seg.jumpFrom&&lt<0.5){val=seg.jumpFrom}
    if(seg.jumpFrom&&lt>=0.5&&lt<0.8){pop=1+0.35*(1-(lt-0.5)/0.3)}
    let red=h.red; if(seg.scene==='behind') red=true;
    const op = red? (.65+.35*Math.abs(Math.sin(t*6))):1;
    const bh=bars.map((b,i)=>`<i style="height:${b*(0.6+0.4*Math.abs(Math.sin(t*8+i)))}px"></i>`).join('');
    hudEl.innerHTML=`<div class="hud"><div><div class="tag"><span class="dot" style="opacity:${Math.floor(t*2)%2?1:.3}">●</span> SCHICHT 3</div><div class="time">${h.time}<small>UHR</small></div><div class="loc">${h.loc}</div></div>
    <div class="right"><div class="tag">${h.label||'ABSTAND'}</div><div class="val ${red?'red':''}" style="transform:scale(${pop});opacity:${op}"><span class="bars">${bh}</span>${val}</div></div></div>`;
  } else hudEl.innerHTML='';
  // Untertitel
  const sub=document.getElementById('sub');
  const c=seg.chunksT.find(c=>t>=c.start&&t<c.end+ (c===seg.chunksT[seg.chunksT.length-1]?0.4:0));
  if(seg.scene==='end'){sub.style.top='820px';sub.style.fontSize=c&&c.text.includes('TEIL')?'170px':'100px';} else {sub.style.top='1440px';sub.style.fontSize='100px';}
  if(c){const a=Math.min(1,(t-c.start)/0.08);sub.className='sub'+(c.speaker==='mehmet'?' m':'');sub.innerHTML=fmtSub(c.text);sub.style.transform=`scale(${0.88+0.12*a})`;sub.style.opacity=a;}
  else sub.innerHTML='';
  // Szenenwechsel-Blitz
  const fl=document.getElementById('flash');const k=Math.max(0,1-lt/0.12);
  fl.style.background=`rgba(255,255,255,${0.18*k})`;
  if(seg.jumpFrom&&lt>=0.5&&lt<0.65) fl.style.background=`rgba(255,210,31,${0.15*(1-(lt-0.5)/0.15)})`;
};
window.renderAt(parseFloat(new URLSearchParams(location.search).get('t')||'1'));
</script></body></html>
