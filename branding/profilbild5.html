<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}svg{display:block}</style></head><body>
<script>
const v = new URLSearchParams(location.search).get('v') || '1';
const Y='#ffd21f', GOLD='#e8b23a';
const R=(i)=>{const x=Math.sin(i*127.1)*43758.5453;return x-Math.floor(x)};

const defs = `<defs>
 <radialGradient id="sky" cx="50%" cy="40%" r="75%"><stop offset="0" stop-color="#2e2468"/><stop offset=".5" stop-color="#17173d"/><stop offset="1" stop-color="#08091a"/></radialGradient>
 <radialGradient id="glow"><stop offset="0" stop-color="${Y}" stop-opacity=".85"/><stop offset=".4" stop-color="#ffb347" stop-opacity=".35"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
 <radialGradient id="ground" cx="50%" cy="0%" r="90%"><stop offset="0" stop-color="#3b2f6e"/><stop offset="1" stop-color="#121230"/></radialGradient>
 <linearGradient id="leather" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#5a2e8a"/><stop offset=".55" stop-color="#3a1d63"/><stop offset="1" stop-color="#22103f"/></linearGradient>
 <linearGradient id="spine" x1="0" x2="1"><stop offset="0" stop-color="#1a0c33"/><stop offset=".6" stop-color="#2d1652"/><stop offset="1" stop-color="#1a0c33"/></linearGradient>
 <linearGradient id="pageL" x1="0" x2="1"><stop offset="0" stop-color="#e6d6ad"/><stop offset=".85" stop-color="#fff7df"/><stop offset="1" stop-color="#cdbb8c"/></linearGradient>
 <linearGradient id="pageR" x1="1" x2="0"><stop offset="0" stop-color="#e6d6ad"/><stop offset=".85" stop-color="#fff7df"/><stop offset="1" stop-color="#cdbb8c"/></linearGradient>
 <linearGradient id="ray" x1="0" x2="0" y1="1" y2="0"><stop offset="0" stop-color="${Y}" stop-opacity=".55"/><stop offset="1" stop-color="${Y}" stop-opacity="0"/></linearGradient>
 <linearGradient id="mist" x1="0" x2="1"><stop offset="0" stop-color="#8f8fd0" stop-opacity="0"/><stop offset=".5" stop-color="#8f8fd0" stop-opacity=".18"/><stop offset="1" stop-color="#8f8fd0" stop-opacity="0"/></linearGradient>
 <filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter>
 <filter id="blur3"><feGaussianBlur stdDeviation="3"/></filter>
</defs>`;

// ---------- Hintergrund ----------
function stars(){let s='';for(let i=0;i<70;i++){const x=R(i)*1024,y=R(i+99)*620,r=1+R(i+7)*2.6,o=.25+R(i+3)*.6;
  s+=`<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" opacity="${o}"/>`;
  if(i%11===0) s+=`<path d="M ${x} ${y-14} L ${x+2.5} ${y} L ${x} ${y+14} L ${x-2.5} ${y} Z M ${x-14} ${y} L ${x} ${y+2.5} L ${x+14} ${y} L ${x} ${y-2.5} Z" fill="#fff" opacity=".8"/>`;}
  return s;}
function moon(){return `<circle cx="790" cy="175" r="90" fill="${Y}" opacity=".12" filter="url(#blur8)"/>
  <circle cx="790" cy="175" r="54" fill="#ffe27a"/><circle cx="772" cy="160" r="10" fill="#e8c24a" opacity=".6"/><circle cx="805" cy="192" r="7" fill="#e8c24a" opacity=".6"/><circle cx="795" cy="158" r="5" fill="#e8c24a" opacity=".6"/>`;}
function pine(x,y,h,c){const w=h*.42;let p=`<rect x="${x-4}" y="${y-6}" width="8" height="12" fill="${c}"/>`;
  for(let k=0;k<3;k++){const yy=y-k*h*.28,ww=w*(1-k*.25);p+=`<path d="M ${x-ww/2} ${yy} L ${x} ${yy-h*.45} L ${x+ww/2} ${yy} Z" fill="${c}"/>`;}return p;}
function landscape(){
  let s=`<path d="M0 640 L110 520 L190 590 L300 450 L380 530 L470 470 L560 560 L650 430 L760 540 L860 470 L1024 600 L1024 1024 L0 1024 Z" fill="#26265a"/>
   <path d="M300 450 L270 485 L295 480 L315 470 Z M650 430 L620 468 L648 462 L672 452 Z M860 470 L835 498 L860 494 L880 488 Z" fill="#c9c9ef" opacity=".55"/>
   <rect x="0" y="560" width="1024" height="60" fill="url(#mist)"/>
   <path d="M0 720 L140 620 L260 700 L400 610 L520 700 L660 620 L800 690 L930 630 L1024 680 L1024 1024 L0 1024 Z" fill="#1d1d48"/>`;
  for(let i=0;i<26;i++){const x=i*42+R(i)*20, h=60+R(i+5)*55; s+=pine(x, 745+R(i+9)*25, h, '#14143a');}
  s+=`<rect x="0" y="700" width="1024" height="50" fill="url(#mist)"/>`;
  s+=`<path d="M0 820 Q 512 760 1024 820 L1024 1024 L0 1024 Z" fill="url(#ground)"/>`;
  return s;}
function particles(cx,cy,spread,n=26,seed=1){let s='';for(let i=0;i<n;i++){const a=R(i+seed)*Math.PI*2,d=R(i+seed*3)*spread,x=cx+Math.cos(a)*d,y=cy-Math.abs(Math.sin(a))*d*1.2-R(i+seed*5)*80,r=2+R(i+seed*7)*5;
  s+=`<circle cx="${x}" cy="${y}" r="${r*2.2}" fill="${Y}" opacity=".18"/><circle cx="${x}" cy="${y}" r="${r}" fill="#fff3b0" opacity="${.5+R(i)*.5}"/>`;}return s;}
function rays(cx,cy,n=9,len=520,spread=1.1){let s='';for(let i=0;i<n;i++){const a=-Math.PI/2+(i/(n-1)-.5)*spread, w=.035+R(i+40)*.03;
  const x1=cx+Math.cos(a-w)*len,y1=cy+Math.sin(a-w)*len,x2=cx+Math.cos(a+w)*len,y2=cy+Math.sin(a+w)*len;
  s+=`<path d="M ${cx} ${cy} L ${x1} ${y1} L ${x2} ${y2} Z" fill="${Y}" opacity="${.07+R(i+50)*.08}"/>`;}return s;}

// ---------- Buch-Bausteine ----------
function corner(x,y,rot){return `<g transform="translate(${x} ${y}) rotate(${rot})"><path d="M 0 0 L 70 0 Q 40 10 30 30 Q 10 40 0 70 Z" fill="${GOLD}"/><path d="M 8 8 L 50 8 Q 30 14 22 22 Q 14 30 8 50 Z" fill="#ffd970"/><circle cx="18" cy="18" r="6" fill="#8a5a12"/></g>`;}
function closedBook(w=440,h=560){ // Ursprung = Mitte
  const x=-w/2,y=-h/2;
  let s=`<ellipse cx="10" cy="${h/2+26}" rx="${w*.62}" ry="34" fill="#05050f" opacity=".55" filter="url(#blur8)"/>`;
  // Seitenblock (rechts/unten sichtbar)
  s+=`<path d="M ${x+40} ${y+h} L ${x+w} ${y+h} L ${x+w+22} ${y+h-14} L ${x+w+22} ${y+16} L ${x+w} ${y+30} L ${x+w} ${y+h-6}" fill="#efe2bd"/>`;
  for(let i=0;i<10;i++) s+=`<path d="M ${x+w+2+i*2} ${y+30-i*1.4} L ${x+w+2+i*2} ${y+h-6-i*1.2}" stroke="#cdbb8c" stroke-width="1.2"/>`;
  s+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="22" fill="url(#leather)"/>`;
  s+=`<rect x="${x}" y="${y}" width="70" height="${h}" rx="18" fill="url(#spine)"/>`;
  [0.18,0.82].forEach(k=>s+=`<rect x="${x+4}" y="${y+h*k-10}" width="62" height="20" rx="6" fill="${GOLD}" opacity=".9"/>`);
  s+=`<rect x="${x+92}" y="${y+24}" width="${w-116}" height="${h-48}" rx="14" fill="none" stroke="${GOLD}" stroke-width="5" opacity=".75"/>`;
  s+=`<rect x="${x+106}" y="${y+38}" width="${w-144}" height="${h-76}" rx="10" fill="none" stroke="${GOLD}" stroke-width="2" opacity=".5"/>`;
  s+=corner(x+w-8,y+8,90)+corner(x+w-8,y+h-8,180)+corner(x+78,y+h-8,270)+corner(x+78,y+8,0);
  s+=`<path d="M ${x+90} ${y+18} L ${x+w-30} ${y+18}" stroke="#fff" stroke-width="4" opacity=".12" stroke-linecap="round"/>`;
  return s;}
function openBook(scale=1){ // Ursprung = Buchrücken unten
  let s=`<g transform="scale(${scale})"><ellipse cx="0" cy="110" rx="420" ry="40" fill="#05050f" opacity=".55" filter="url(#blur8)"/>
   <path d="M -390 60 Q -200 0 0 70 Q 200 0 390 60 L 390 110 Q 200 50 0 120 Q -200 50 -390 110 Z" fill="#3a1d63"/>
   <path d="M -390 60 Q -200 0 0 70 Q 200 0 390 60" stroke="${GOLD}" stroke-width="5" fill="none" opacity=".8"/>`;
  for(let i=5;i>=0;i--){const o=i*7;
    s+=`<path d="M ${-370} ${-215+o+40} Q -185 ${-270+o+40} 0 ${-200+o+40} L 0 ${70+o*.3} Q -185 ${5+o} -370 ${60+o} Z" fill="${i? '#d9c697':'url(#pageL)'}" ${i?'opacity=".9"':''}/>`;
    s+=`<path d="M ${370} ${-215+o+40} Q 185 ${-270+o+40} 0 ${-200+o+40} L 0 ${70+o*.3} Q 185 ${5+o} 370 ${60+o} Z" fill="${i? '#d9c697':'url(#pageR)'}" ${i?'opacity=".9"':''}/>`;}
  for(let i=0;i<6;i++){s+=`<path d="M -320 ${-140+i*36} Q -175 ${-188+i*36} -45 ${-140+i*36}" stroke="#bfae80" stroke-width="7" fill="none" stroke-linecap="round" opacity=".7"/>`;
    if(i<5) s+=`<path d="M 45 ${-140+i*36} Q 175 ${-188+i*36} 320 ${-140+i*36}" stroke="#bfae80" stroke-width="7" fill="none" stroke-linecap="round" opacity=".7"/>`;}
  s+=`<path d="M 0 -160 L 0 70" stroke="#a8946a" stroke-width="5"/><path d="M -6 -160 Q -14 -40 -6 70" stroke="#000" stroke-width="10" opacity=".08" fill="none"/>`;
  s+=`<path d="M 30 70 L 30 170 L 48 150 L 66 170 L 66 66" fill="#c0263a"/>`;
  return s+'</g>';}
const eyes=(x,y,s,lx=0)=>`<g transform="translate(${x} ${y}) scale(${s})"><circle cx="-30" cy="0" r="40" fill="${Y}" opacity=".25" filter="url(#blur3)"/><circle cx="30" cy="0" r="40" fill="${Y}" opacity=".25" filter="url(#blur3)"/><circle cx="-30" cy="0" r="26" fill="#fff"/><circle cx="30" cy="0" r="26" fill="#fff"/><circle cx="${-30+lx}" cy="-2" r="11" fill="#000"/><circle cx="${30+lx}" cy="-2" r="11" fill="#000"/><circle cx="${-26+lx}" cy="-7" r="4" fill="#fff"/><circle cx="${34+lx}" cy="-7" r="4" fill="#fff"/></g>`;
const arrowHead=(x,y,rot,s=1)=>`<path transform="translate(${x} ${y}) rotate(${rot}) scale(${s})" d="M 0 -48 L -42 30 L 42 30 Z" fill="${Y}" stroke="${Y}" stroke-width="12" stroke-linejoin="round"/>`;
function twistRibbon(d,w,shadow=true){ // Pfeil mit Glanzkante
  return `${shadow?`<path d="${d}" stroke="${Y}" stroke-width="${w*2.2}" fill="none" stroke-linecap="round" opacity=".18" filter="url(#blur8)"/>`:''}
   <path d="${d}" stroke="#d9a300" stroke-width="${w}" fill="none" stroke-linecap="round"/>
   <path d="${d}" stroke="${Y}" stroke-width="${w*.72}" fill="none" stroke-linecap="round"/>
   <path d="${d}" stroke="#fff3a8" stroke-width="${w*.18}" fill="none" stroke-linecap="round" opacity=".8" transform="translate(-${w*.12} -${w*.12})"/>`;}

// ---------- Gruselige Bausteine ----------
const RED='#ff2a3c';
const xdefs=`<defs><radialGradient id="redglow"><stop offset="0" stop-color="${RED}" stop-opacity=".7"/><stop offset="1" stop-color="${RED}" stop-opacity="0"/></radialGradient>
 <radialGradient id="whiteglow"><stop offset="0" stop-color="#e8f0ff" stop-opacity=".8"/><stop offset="1" stop-color="#e8f0ff" stop-opacity="0"/></radialGradient>
 <radialGradient id="moonG" cx="40%" cy="38%" r="65%"><stop offset="0" stop-color="#fff2b0"/><stop offset=".7" stop-color="#ffd85a"/><stop offset="1" stop-color="#e8a93a"/></radialGradient>
 <radialGradient id="greenglow"><stop offset="0" stop-color="#b8ff8a" stop-opacity=".6"/><stop offset="1" stop-color="#b8ff8a" stop-opacity="0"/></radialGradient>
 <linearGradient id="fog" x1="0" x2="1"><stop offset="0" stop-color="#b0a8e0" stop-opacity="0"/><stop offset=".5" stop-color="#b0a8e0" stop-opacity=".22"/><stop offset="1" stop-color="#b0a8e0" stop-opacity="0"/></linearGradient></defs>`;
function deadTree(x,y,h,c='#07060d',s=1){
  return `<g transform="translate(${x} ${y}) scale(${s})" fill="none" stroke="${c}" stroke-linecap="round">
    <path d="M 0 0 C -6 -${h*.3} 10 -${h*.55} -4 -${h}" stroke-width="22"/>
    <path d="M -2 -${h*.55} C -40 -${h*.65} -70 -${h*.7} -96 -${h*.86}" stroke-width="11"/><path d="M 4 -${h*.7} C 40 -${h*.78} 66 -${h*.82} 88 -${h*.98}" stroke-width="10"/>
    <path d="M -60 -${h*.68} L -84 -${h*.62}" stroke-width="6"/><path d="M 50 -${h*.8} L 74 -${h*.76}" stroke-width="5"/></g>`;
}
function spookyLand(){
  let s=`<path d="M0 650 L120 560 L210 610 L330 500 L430 590 L540 520 L650 600 L760 490 L880 580 L1024 540 L1024 1024 L0 1024 Z" fill="#1b1838"/>
   <rect x="0" y="600" width="1024" height="70" fill="url(#fog)"/>
   <path d="M0 760 Q 260 700 520 740 Q 780 780 1024 730 L1024 1024 L0 1024 Z" fill="#100e24"/>`;
  [[90,790,170,.9],[230,770,120,.7],[860,780,190,1],[970,800,130,.8]].forEach(([x,y,h,sc])=>s+=deadTree(x,y,h,'#07060d',sc));
  s+=`<rect x="0" y="730" width="1024" height="60" fill="url(#fog)"/><path d="M0 860 Q 512 800 1024 860 L1024 1024 L0 1024 Z" fill="#0a0918"/>`;
  return s;
}
function claws(pts){return pts.map(([x1,y1,cx,cy,x2,y2],i)=>`<path d="M ${x1} ${y1} Q ${cx} ${cy} ${x2} ${y2}" stroke="#0a0812" stroke-width="${14-i}" fill="none" stroke-linecap="round"/><circle cx="${x2}" cy="${y2}" r="4" fill="#cfc8e8"/>`).join('');}
const V={
  // 5: Aus dem Spalt eines offenen Buchs schauen Augen, Krallen greifen nach der Seite
  '5':()=>`${spookyLand()}
    <g transform="translate(512 700)"><circle cx="0" cy="-120" r="330" fill="url(#greenglow)" opacity=".45"/>
     ${openBook(.8)}
     <path d="M -66 -175 Q 0 -250 66 -175 L 58 30 Q 0 62 -58 30 Z" fill="#05040b"/>
     <path d="M -66 -175 Q 0 -250 66 -175 L 58 30 Q 0 62 -58 30 Z" fill="none" stroke="#b8ff8a" stroke-width="6" opacity=".6" filter="url(#blur3)"/>
     ${eyes(0,-95,.82,8)}
     ${claws([[40,-40,110,-150,170,-150],[44,-10,140,-110,210,-108],[44,20,150,-60,226,-56],[40,40,130,10,200,10]])}
     ${twistRibbon('M -30 70 C -50 170 -230 160 -214 70 C -206 22 -146 26 -150 76',24,false)}${arrowHead(-150,86,180,.55)}
    </g>${particles(512,460,260,22,4)}`,
  // 6: Toter Baum in T-Form vor riesigem Mond, Puppe am Seil, Augen im Stamm
  '6':()=>`<circle cx="512" cy="430" r="300" fill="url(#moonG)"/>
    ${[[420,330,34],[620,520,24],[560,300,16],[440,560,20]].map(([x,y,r])=>`<circle cx="${x}" cy="${y}" r="${r}" fill="#e8b84a" opacity=".55"/>`).join('')}
    <path d="M0 860 Q 260 780 512 800 Q 780 820 1024 780 L1024 1024 L0 1024 Z" fill="#0a0918"/>
    <g fill="none" stroke="#06050c" stroke-linecap="round">
     <path d="M 500 1024 C 470 900 540 760 506 600 C 490 520 520 420 512 330" stroke-width="64"/>
     <path d="M 512 340 C 420 300 300 330 230 300 C 170 276 150 210 205 196 C 250 186 262 240 225 250" stroke-width="30"/>
     <path d="M 512 340 C 600 300 720 330 790 300 C 850 276 870 210 815 196 C 770 186 758 240 795 250" stroke-width="30"/>
     <path d="M 330 318 L 300 270 M 660 318 L 700 268 M 470 470 L 400 440" stroke-width="12"/></g>
    <g transform="rotate(5 700 312)"><path d="M 668 316 L 664 600 M 732 316 L 736 600" stroke="#06050c" stroke-width="5"/><rect x="644" y="596" width="112" height="16" rx="4" fill="#06050c"/></g>
    <g transform="translate(512 336) rotate(-7)">
      <ellipse cx="0" cy="0" rx="128" ry="24" fill="#06050c"/>
      <path d="M -66 -8 L 66 -8 Q 44 -92 34 -156 Q 30 -198 78 -220 Q 30 -226 12 -186 Q -22 -124 -66 -8 Z" fill="#06050c"/>
      <path d="M -62 -20 L 62 -20 L 57 -44 L -55 -44 Z" fill="#4b2a7a"/>
      <rect x="-15" y="-46" width="30" height="28" rx="4" fill="none" stroke="#e8b23a" stroke-width="6"/>
    </g>
    <rect x="0" y="820" width="1024" height="60" fill="url(#fog)"/>`,
  // 7: Geschlossenes Buch – durch das Schlüsselloch starrt ein Auge
  '7':()=>`${spookyLand()}
    <g transform="translate(512 610)"><circle cx="30" cy="-40" r="300" fill="url(#redglow)" opacity=".45"/>
     ${closedBook(420,540)}
     <clipPath id="kh"><circle cx="40" cy="-70" r="62"/><path d="M 10 -40 L 70 -40 L 96 110 L -16 110 Z"/></clipPath>
     <circle cx="40" cy="-70" r="70" fill="#000"/><path d="M 6 -46 L 74 -46 L 102 116 L -22 116 Z" fill="#000"/>
     <g clip-path="url(#kh)"><rect x="-60" y="-160" width="200" height="300" fill="#e8e2d6"/>
       ${[0,1,2,3,4].map(i=>`<path d="M ${-20+i*10} ${-130+i*6} q 30 30 52 54" stroke="#c0394a" stroke-width="2.5" fill="none" opacity=".7"/>`).join('')}
       <circle cx="44" cy="-62" r="44" fill="${Y}"/><circle cx="44" cy="-62" r="38" fill="none" stroke="#c98a00" stroke-width="5"/><circle cx="44" cy="-62" r="17" fill="#000"/><circle cx="34" cy="-74" r="7" fill="#fff"/></g>
     <circle cx="40" cy="-70" r="66" fill="none" stroke="${RED}" stroke-width="6" opacity=".5" filter="url(#blur3)"/>
     <g transform="translate(140 260)">${twistRibbon('M 0 0 L 0 50 C 0 130 110 130 110 60 C 110 15 55 15 55 60',26,false)}${arrowHead(55,70,180,.55)}</g>
    </g>`,
  // 8: Jemand liest nachts – sein Schatten an der Wand ist nicht seiner
  '8':()=>`<rect width="1024" height="1024" fill="#140f26"/>${Array.from({length:12},(_,i)=>`<rect x="${i*90}" y="0" width="6" height="820" fill="#1b1534"/>`).join('')}
    <rect x="690" y="110" width="250" height="280" rx="8" fill="#0b0a1c"/><rect x="704" y="124" width="222" height="252" fill="#1d1d4a"/><circle cx="860" cy="200" r="46" fill="url(#moonG)"/><path d="M 815 124 L 815 376 M 704 250 L 926 250" stroke="#0b0a1c" stroke-width="10"/>
    <path d="M 420 820 C 380 600 440 380 560 330 C 600 250 640 230 650 300 C 690 250 740 260 700 340 C 800 380 820 520 780 640 L 860 560 C 900 520 960 540 930 590 L 840 700 C 820 760 800 800 790 820 Z" fill="#050409" opacity=".92"/>
    <path d="M 600 336 Q 548 236 600 150 Q 596 236 644 318 Z M 690 340 Q 748 240 706 152 Q 720 240 668 322 Z" fill="#050409" opacity=".92"/>
    <path d="M 760 470 C 680 430 600 430 520 470" stroke="#050409" stroke-width="44" fill="none" stroke-linecap="round" opacity=".92"/>
    ${claws([[520,470,470,440,440,410],[520,480,462,470,432,452],[522,490,470,500,444,500]])}
    <circle cx="640" cy="390" r="16" fill="${RED}"/><circle cx="690" cy="390" r="16" fill="${RED}"/><circle cx="665" cy="390" r="70" fill="url(#redglow)" opacity=".6"/>
    <rect x="0" y="820" width="1024" height="204" fill="#0c0919"/>
    <ellipse cx="380" cy="760" rx="300" ry="230" fill="url(#glow)" opacity=".35"/>
    <path d="M 220 1024 Q 230 780 380 760 Q 530 780 540 1024 Z" fill="${Y}"/><path d="M 300 800 Q 380 830 460 800" stroke="#d9a300" stroke-width="10" fill="none"/>
    <circle cx="380" cy="600" r="125" fill="#0a0a0a"/>
    <g transform="translate(380 640) scale(1.25)"><circle cx="-30" cy="0" r="26" fill="#fff"/><circle cx="30" cy="0" r="26" fill="#fff"/><circle cx="-30" cy="10" r="11" fill="#000"/><circle cx="30" cy="10" r="11" fill="#000"/><ellipse cx="0" cy="46" rx="9" ry="11" fill="#fff"/></g>
    <g transform="translate(380 830)"><path d="M -150 0 Q -75 -40 0 -10 Q 75 -40 150 0 L 150 40 Q 75 10 0 40 Q -75 10 -150 40 Z" fill="url(#pageL)"/><path d="M 0 -10 L 0 40" stroke="#bfae80" stroke-width="4"/></g>
    <circle cx="300" cy="850" r="22" fill="#0a0a0a"/><circle cx="460" cy="850" r="22" fill="#0a0a0a"/>`,
};
document.body.innerHTML = `<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">${defs}${xdefs}
 <rect width="1024" height="1024" fill="url(#sky)"/>${v==='8'?'':stars()+(v==='6'?'':moon())}${V[v]()}</svg>`;
</script></body></html>
