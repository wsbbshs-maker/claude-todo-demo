<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}svg{display:block}</style></head><body>
<script>
const v = new URLSearchParams(location.search).get('v') || 'c';
const Y='#ffd21f';
const stars = Array.from({length:40},(_,i)=>{const x=(Math.sin(i*91.7)*0.5+0.5)*1024,y=(Math.sin(i*37.3)*0.5+0.5)*1024,r=1.5+((i*7)%3);return `<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" opacity="${.2+((i*13)%5)/12}"/>`}).join('');
const defs = `<defs>
 <radialGradient id="bg" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#2a2160"/><stop offset=".55" stop-color="#151538"/><stop offset="1" stop-color="#090a1c"/></radialGradient>
 <radialGradient id="glow"><stop offset="0" stop-color="${Y}" stop-opacity=".7"/><stop offset="1" stop-color="${Y}" stop-opacity="0"/></radialGradient>
 <radialGradient id="glowB" cx="50%" cy="100%" r="80%"><stop offset="0" stop-color="${Y}" stop-opacity=".6"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
 <linearGradient id="page" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff6dc"/><stop offset="1" stop-color="#e9dcb8"/></linearGradient>
</defs>`;
const moon = `<circle cx="800" cy="190" r="42" fill="${Y}" opacity=".9"/><circle cx="783" cy="178" r="42" fill="#1d1a45"/>`;
const eyes=(x,y,s,lx=0)=>`<g transform="translate(${x} ${y}) scale(${s})"><circle cx="-30" cy="0" r="26" fill="#fff"/><circle cx="30" cy="0" r="26" fill="#fff"/><circle cx="${-30+lx}" cy="-2" r="11" fill="#000"/><circle cx="${30+lx}" cy="-2" r="11" fill="#000"/></g>`;
const arrowHead=(x,y,rot,s=1)=>`<path transform="translate(${x} ${y}) rotate(${rot}) scale(${s})" d="M 0 -48 L -42 30 L 42 30 Z" fill="${Y}" stroke="${Y}" stroke-width="12" stroke-linejoin="round"/>`;

const V = {
  // C: Monogramm "T", dessen Stamm sich zu einer Spirale dreht
  c: `<circle cx="512" cy="512" r="330" fill="url(#glow)" opacity=".5"/>
      <rect x="292" y="250" width="440" height="96" rx="30" fill="${Y}"/>
      <path d="M 512 330 L 512 560 C 512 700 680 700 680 590 C 680 500 560 500 565 590" stroke="${Y}" stroke-width="96" fill="none" stroke-linecap="round"/>
      ${arrowHead(566,600,180,1.25)}`,
  // D: Geschlossenes Buch mit leuchtendem Schlüsselloch, Lesezeichen als Twist-Pfeil
  d: `${moon}<ellipse cx="512" cy="900" rx="520" ry="380" fill="url(#glowB)"/>
      <g transform="translate(512 540)">
       <rect x="-230" y="-290" width="460" height="580" rx="28" fill="#2b1a4a"/><rect x="-230" y="-290" width="64" height="580" rx="20" fill="#1c1236"/>
       <rect x="-200" y="262" width="420" height="20" rx="6" fill="#fff6dc"/>
       <circle cx="30" cy="-20" r="150" fill="url(#glow)"/>
       <circle cx="30" cy="-55" r="48" fill="${Y}"/><path d="M 4 -30 L 56 -30 L 78 90 L -18 90 Z" fill="${Y}"/>
       <path d="M 150 290 L 150 360 C 150 430 250 430 250 370 C 250 330 200 330 200 365" stroke="${Y}" stroke-width="30" fill="none" stroke-linecap="round"/>
      </g>`,
  // E: Buch leicht geöffnet – aus dem dunklen Spalt schauen Augen heraus
  e: `${moon}<ellipse cx="512" cy="900" rx="520" ry="380" fill="url(#glowB)"/>
      <g transform="translate(512 600)">
       <path d="M -330 120 L -20 200 L -20 -200 L -330 -280 Z" fill="#3a2366"/>
       <path d="M -300 110 L -20 180 L -20 -180 L -300 -250 Z" fill="url(#page)" opacity=".15"/>
       <path d="M 330 120 L 20 200 L 20 -200 L 330 -280 Z" fill="#3a2366"/>
       <path d="M -20 -200 L 20 -200 L 20 200 L -20 200 Z" fill="#05050c"/>
       <path d="M -330 120 L -20 200 L 20 200 L 330 120 L 330 150 L 20 230 L -20 230 L -330 150 Z" fill="#fff6dc"/>
       <path d="M -260 -200 L -70 -150 L -70 120 L -260 70 Z" fill="#05050c" opacity=".85"/>
       ${eyes(-165,-30,1.6,14)}
      </g>`,
  // F: Offenes Buch, aus den Seiten steigt ein Wirbel aus Licht
  f: `${moon}<ellipse cx="512" cy="760" rx="520" ry="420" fill="url(#glowB)"/>
      <path d="M 512 640 C 380 560 380 420 512 420 C 640 420 640 560 540 560 C 460 560 470 470 520 480" stroke="${Y}" stroke-width="34" fill="none" stroke-linecap="round" opacity=".95"/>
      <path d="M 512 640 C 430 600 410 520 440 470" stroke="#fff6dc" stroke-width="10" fill="none" stroke-linecap="round" opacity=".6"/>
      ${[0,1,2,3,4,5].map(i=>`<circle cx="${400+i*45}" cy="${380-((i*37)%90)}" r="${6+(i%3)*3}" fill="${Y}" opacity=".7"/>`).join('')}
      <g transform="translate(512 790) scale(.8)">
       <path d="M -360 40 Q -180 -10 0 50 Q 180 -10 360 40 L 360 90 Q 180 40 0 100 Q -180 40 -360 90 Z" fill="#7a3b1f"/>
       <path d="M -340 -200 Q -170 -260 0 -190 L 0 60 Q -170 -10 -340 50 Z" fill="url(#page)"/>
       <path d="M 340 -200 Q 170 -260 0 -190 L 0 60 Q 170 -10 340 50 Z" fill="url(#page)"/>
      </g>`,
  // G: Reines Logo-Zeichen: gelber Kreis-Pfeil, der sich überschlägt (Twist), darin ein Buch
  g: `<circle cx="512" cy="512" r="330" fill="url(#glow)" opacity=".35"/>
      <path d="M 300 600 A 230 230 0 1 1 690 640" stroke="${Y}" stroke-width="64" fill="none" stroke-linecap="round"/>
      ${arrowHead(700,640,140,1.5)}
      <g transform="translate(512 545) scale(.48)">
       <path d="M -340 -200 Q -170 -260 0 -190 L 0 60 Q -170 -10 -340 50 Z" fill="url(#page)"/>
       <path d="M 340 -200 Q 170 -260 0 -190 L 0 60 Q 170 -10 340 50 Z" fill="url(#page)"/>
       <path d="M -360 40 Q -180 -10 0 50 Q 180 -10 360 40 L 360 90 Q 180 40 0 100 Q -180 40 -360 90 Z" fill="#7a3b1f"/>
      </g>`,
  // H: Sprechblase in Buchform mit "?!" – Story + Überraschung
  h: `${moon}<ellipse cx="512" cy="900" rx="520" ry="380" fill="url(#glowB)"/>
      <g transform="translate(512 500)">
       <path d="M -300 -230 Q -150 -280 0 -230 Q 150 -280 300 -230 L 300 170 Q 150 120 0 170 Q -150 120 -300 170 Z" fill="url(#page)"/>
       <path d="M 0 -230 L 0 170" stroke="#b9a678" stroke-width="8"/>
       <path d="M -120 160 L -170 280 L -40 168 Z" fill="#e9dcb8"/>
       <text x="-150" y="80" text-anchor="middle" font-family="Inter" font-weight="800" font-size="260" fill="#0b0b14">?</text>
       <text x="150" y="80" text-anchor="middle" font-family="Inter" font-weight="800" font-size="260" fill="${Y}" stroke="#0b0b14" stroke-width="10" paint-order="stroke">!</text>
      </g>`,
};
document.body.innerHTML = `<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">${defs}
 <rect width="1024" height="1024" fill="url(#bg)"/>${stars}${V[v]}</svg>`;
</script></body></html>
